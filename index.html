<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D1B2A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Copa 2026">
  <meta name="description" content="Gerencie suas figurinhas da Copa do Mundo 2026 Panini">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Copa 2026 — Panini Figurinhas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">

  <!-- ══════════════════════════════════════
       TELA DE SELEÇÃO DE USUÁRIO
  ══════════════════════════════════════ -->
  <div id="user-screen">
    <div class="us-logo">⚽</div>
    <h1 class="us-title">Copa 2026</h1>
    <p class="us-sub">Figurinhas Panini</p>

    <p class="us-label">Quem está jogando?</p>
    <div id="user-list"></div>

    <button class="us-new-btn" onclick="showCreateUser()">+ Novo Usuário</button>
  </div>

  <!-- ══════════════════════════════════════
       APP PRINCIPAL (oculto até login)
  ══════════════════════════════════════ -->
  <div id="main-ui">

    <header>
      <button id="user-pill" class="user-pill" onclick="goUserScreen()">
        <span id="pill-emoji">⚽</span>
        <span id="pill-name">Usuário</span>
        <span class="pill-arrow">▾</span>
      </button>
      <div class="header-stats">
        <span id="sync-status" class="sync-chip" title=""></span>
        <span id="stat-collected" class="stat-chip green">✓ 0/660</span>
        <span id="stat-duplicate" class="stat-chip orange">🔁 0</span>
        <span id="stat-missing"   class="stat-chip red">✗ 660</span>
      </div>
    </header>

    <main id="main-content">
      <div id="view-album"      class="view active"></div>
      <div id="view-needed"     class="view"></div>
      <div id="view-duplicates" class="view"></div>
      <div id="view-stats"      class="view"></div>
      <div id="view-trade"      class="view"></div>
    </main>

    <nav>
      <button class="nav-btn active" data-view="album"      onclick="showView('album')">
        <span class="icon">📖</span>Álbum
      </button>
      <button class="nav-btn" data-view="needed"     onclick="showView('needed')">
        <span class="icon">❌</span>Faltam
      </button>
      <button class="nav-btn" data-view="duplicates" onclick="showView('duplicates')">
        <span class="icon">🔁</span>Repetidas
      </button>
      <button class="nav-btn" data-view="stats"      onclick="showView('stats')">
        <span class="icon">📊</span>Stats
      </button>
      <button class="nav-btn" data-view="trade"      onclick="showView('trade')">
        <span class="icon">🤝</span>Trocar
      </button>
    </nav>

  </div><!-- /main-ui -->

</div><!-- /app -->

<!-- ══════════════════════════════════════
     MODAL — FIGURINHA
══════════════════════════════════════ -->
<div id="modal-overlay">
  <div class="modal">
    <div id="modal-title" class="modal-title">Figurinha</div>
    <div id="modal-name"  class="modal-name">Nome</div>
    <div class="modal-counter">
      <button class="counter-btn" onclick="modalChange(-1)">−</button>
      <div id="modal-count" class="counter-num">0</div>
      <button class="counter-btn" onclick="modalChange(1)">+</button>
    </div>
    <div class="modal-labels">
      <span id="modal-label" style="color:var(--text-muted)">Não tenho</span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-danger"  onclick="modalClear()">Remover</button>
      <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MODAL — CRIAR / EDITAR USUÁRIO
══════════════════════════════════════ -->
<div id="user-modal-overlay" onclick="closeUserModal(event)">
  <div class="modal user-modal">
    <div class="modal-title" id="user-modal-heading">Novo Usuário</div>

    <label class="field-label">Nome</label>
    <input id="user-name-input" class="field-input"
           type="text" maxlength="20" placeholder="Seu nome"
           onkeydown="if(event.key==='Enter')confirmUserModal()">

    <label class="field-label">Avatar</label>
    <div class="avatar-grid" id="emoji-grid"></div>

    <label class="field-label">Cor</label>
    <div class="color-grid" id="color-grid"></div>

    <div class="modal-actions" style="margin-top:16px">
      <button class="btn btn-ghost"   onclick="closeUserModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="confirmUserModal()">Salvar</button>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
