<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D1B2A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Copa 2026">
  <meta name="description" content="Gerencie suas figurinhas da Copa do Mundo 2026 Panini">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" href="icons/icon-192.png">
  <title>Copa 2026 — Panini Figurinhas</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <!-- HEADER -->
    <header>
      <h1>⚽ Copa 2026</h1>
      <div class="header-stats">
        <span id="stat-collected" class="stat-chip green">✓ 0/468</span>
        <span id="stat-duplicate" class="stat-chip orange">🔁 0 rep.</span>
        <span id="stat-missing"   class="stat-chip red">✗ 468</span>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content">

      <!-- ALBUM VIEW -->
      <div id="view-album" class="view active">
        <!-- rendered by JS -->
      </div>

      <!-- NEEDED VIEW -->
      <div id="view-needed" class="view">
        <!-- rendered by JS -->
      </div>

      <!-- DUPLICATES VIEW -->
      <div id="view-duplicates" class="view">
        <!-- rendered by JS -->
      </div>

      <!-- STATS VIEW -->
      <div id="view-stats" class="view">
        <!-- rendered by JS -->
      </div>

      <!-- TRADE VIEW -->
      <div id="view-trade" class="view">
        <!-- rendered by JS -->
      </div>

    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav>
      <button class="nav-btn active" data-view="album" onclick="showView('album')">
        <span class="icon">📖</span>Álbum
      </button>
      <button class="nav-btn" data-view="needed" onclick="showView('needed')">
        <span class="icon">❌</span>Faltam
      </button>
      <button class="nav-btn" data-view="duplicates" onclick="showView('duplicates')">
        <span class="icon">🔁</span>Repetidas
      </button>
      <button class="nav-btn" data-view="stats" onclick="showView('stats')">
        <span class="icon">📊</span>Stats
      </button>
      <button class="nav-btn" data-view="trade" onclick="showView('trade')">
        <span class="icon">🤝</span>Trocar
      </button>
    </nav>

  </div>

  <!-- STICKER MODAL -->
  <div id="modal-overlay">
    <div class="modal">
      <div id="modal-title" class="modal-title">Figurinha #1</div>
      <div id="modal-name" class="modal-name">Nome</div>
      <div class="modal-counter">
        <button class="counter-btn" onclick="modalChange(-1)">−</button>
        <div id="modal-count" class="counter-num">0</div>
        <button class="counter-btn" onclick="modalChange(1)">+</button>
      </div>
      <div class="modal-labels">
        <span id="modal-label" style="color:var(--text-muted)">Não tenho</span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-danger" onclick="modalClear()">Remover</button>
        <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
      </div>
    </div>
  </div>

  <!-- DATA -->
  <script src="js/data.js"></script>
  <!-- APP -->
  <script src="js/app.js"></script>
</body>
</html>
